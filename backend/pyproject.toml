[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ajant-backend"
version = "0.1.0"
description = "ajant — Wazuh + Qwen3 4B Security Agent (FastAPI backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "uvicorn>=0.30,<1",
  "SQLAlchemy>=2.0.35,<2.1",
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "aiosqlite>=0.20,<1",
  "structlog>=24.4,<26",
  "httpx>=0.27,<1",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
# FastAPI Query() bağımsız değişken kalıbı B008 üretir; Annotated kalıbına
# geçiş yerine API katmanında kalıp izni (çerçeve dokümantasyonuyla uyumlu).
"app/api/*" = ["B008"]
# Faz 09 benchmark runner: yalnızca SABİT argümanlı git/ollama introspection
# (kullanıcı girdisi yok; S603 çağrı başına noqa ile işaretlidir).
"benchmarks/*" = ["S603", "S607"]
# Dataset üreteci: full_log içerikleri bayt-deterministik sentetik log
# metinleridir; satır uzunluğu içerikte anlamlı değildir (JSONL çıktısı
# lint kapsamı dışıdır).
"benchmarks/tools/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true
warn_unused_ignores = false
ignore_missing_imports = true
